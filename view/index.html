<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crosstab</title>
    <link rel="icon" href="../icons/icon.svg" />
    <link rel="stylesheet" href="view.css" />
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>
          <img src="../icons/icon.svg" alt="" />
          Crosstab
          <span id="count" aria-live="polite"
            ><span id="tab-count"></span
            ><span id="duplicates-sep" hidden> &middot; </span
            ><button id="duplicates" type="button" hidden></button
          ></span>
        </h1>
        <div class="actions">
          <button
            id="reorganise"
            type="button"
            popovertarget="reorganise-menu"
            aria-haspopup="menu"
            aria-expanded="false"
            disabled
          >
            Reorganise
          </button>
          <div id="reorganise-menu" popover role="menu">
            <button type="button" role="menuitem" id="merge">
              Move all tabs into this window
            </button>
            <button type="button" role="menuitem" id="merge-groups">
              Move windows into this window as tab groups
            </button>
            <button type="button" role="menuitem" id="mirror" hidden>
              Mirror grouping as tab groups
            </button>
          </div>
          <button id="undo-merge" type="button" hidden>Undo reorganise</button>
        </div>
      </div>
      <div class="controls">
        <div class="search">
          <input
            id="search"
            type="search"
            list="search-suggestions"
            placeholder="Search open tabs"
            aria-label="Search open tabs"
            autofocus
          />
          <button
            id="search-clear"
            type="button"
            aria-label="Clear search"
            hidden
          >
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                d="m4 4 8 8m0-8-8 8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <label>
          Group by
          <select id="group-by">
            <option value="window">Window</option>
            <option value="domain">Domain</option>
            <option value="domainWindow">Domain + Window</option>
            <option value="tabGroup">Tab group</option>
            <option value="lastAccessed">Last accessed</option>
            <option value="created">Created</option>
          </select>
        </label>
        <datalist id="search-suggestions"></datalist>
      </div>
    </header>
    <main id="cards"></main>
    <aside id="customize-panel" aria-labelledby="customize-title" inert>
      <div class="panel-header">
        <h2 id="customize-title">Customize</h2>
        <button id="customize-close" type="button" aria-label="Close">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path
              d="m4 4 8 8m0-8-8 8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <label>
        Sort by
        <select id="sort-by">
          <option value="recent">Recent activity</option>
          <option value="order">Tab order</option>
          <option value="title">Title</option>
          <option value="url">URL</option>
        </select>
      </label>
      <label>
        Display
        <select id="label">
          <option value="both">Title + URL</option>
          <option value="title">Title</option>
          <option value="url">URL</option>
        </select>
      </label>
    </aside>
    <button
      id="customize"
      type="button"
      aria-expanded="false"
      aria-controls="customize-panel"
    >
      <span class="customize-label"><span>Customize</span></span>
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M10.118 1.47a2.605 2.605 0 0 1 3.336.296l.781.78c.962.962 1.026 2.5.141 3.537a68.5 68.5 0 0 1-7.703 7.694l-1.023.854a1.64 1.64 0 0 1-1.043.37H1.75a.75.75 0 0 1-.75-.75v-2.857c0-.376.126-.745.371-1.044a68 68 0 0 1 8.547-8.725zM8.797 4.63A67 67 0 0 0 2.53 11.3a.14.14 0 0 0-.031.094v2.108h2.107a.14.14 0 0 0 .092-.032H4.7a66.5 66.5 0 0 0 6.669-6.267zm3.597-1.803a1.106 1.106 0 0 0-1.502-.062q-.488.415-.984.856l2.47 2.47q.441-.495.857-.982c.375-.44.35-1.092-.06-1.502z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <script type="module" src="main.js"></script>
  </body>
</html>
