name: Listing

on:
  push:
    branches: [main]
    paths:
      - listing/**
      - amo-metadata.json
      - scripts/amo-listing.js
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run midway through replacing the screenshots.
concurrency:
  group: listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    # AMO throttles with `Retry-After` waits of up to about 40 minutes per request.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run listing
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
